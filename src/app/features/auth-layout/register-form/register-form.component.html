<div class="flex flex-col items-center w-full max-w-[1000px] mx-auto animate-slide-in">
    <h1 class="text-3xl font-bold mb-8 text-[#30B2E1] self-start form-element">Create Account</h1>

    <!-- Profile Picture Upload -->
    <div class="mb-8 relative form-element">
        <div class="w-32 h-32 rounded-full overflow-hidden border-2 border-[#30B2E1] relative cursor-pointer"
             (click)="triggerFileInput()">
            <img [src]="profileImageUrl || 'assets/default-profile.png'"
                 alt="Profile Picture"
                 class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                <span class="text-white text-sm">Change Photo</span>
            </div>
        </div>
        <input type="file"
               #fileInput
               (change)="onFileSelected($event)"
               accept="image/*"
               class="hidden" />
    </div>

    <form (ngSubmit)="onSubmit()" class="w-full">
        <!-- Personal Information -->
        <p class="text-sm text-gray-500 mb-2 form-element">Personal Information</p>
        <div class="grid grid-cols-3 gap-8 mb-6">
            <input
              type="text"
              [(ngModel)]="fullName"
              name="fullName"
              placeholder="Full Name"
              class="px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none text-base w-full form-element"
            />
            <input
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="Email Address"
                class="px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none text-base w-full form-element"
            />
        </div>

        <!-- User Account -->
        <p class="text-sm text-gray-500 mb-2 form-element">User Account</p>
        <div class="grid grid-cols-2 gap-8 mb-6">
            <input
                type="text"
                [(ngModel)]="username"
                name="username"
                placeholder="User Name"
                class="px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none text-base w-full form-element"
            />
            <select
                [(ngModel)]="department"
                name="department"
                class="px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none appearance-none bg-white text-base w-full form-element"
            >
                <option value="" disabled selected>Department</option>
                <option value="it">IT Department</option>
                <option value="hr">HR Department</option>
                <option value="finance">Finance Department</option>
            </select>
        </div>

        <!-- Password Fields -->
        <p class="text-sm text-gray-500 mb-2 form-element">Password</p>
        <div class="grid grid-cols-2 gap-8 mb-8">
            <div class="relative w-full form-element">
                <input
                    [type]="showPassword ? 'text' : 'password'"
                    [(ngModel)]="password"
                    name="password"
                    placeholder="Password"
                    class="w-full px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none text-base"
                />
                <button type="button"
                        (click)="togglePassword('password')"
                        class="absolute right-6 top-1/2 transform -translate-y-1/2 text-gray-500">
                    <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                </button>
            </div>
            <div class="relative w-full form-element">
                <input
                    [type]="showConfirmPassword ? 'text' : 'password'"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm Password"
                    class="w-full px-6 py-3.5 rounded-full border border-gray-300 focus:border-[#30B2E1] focus:outline-none text-base"
                />
                <button type="button"
                        (click)="togglePassword('confirm')"
                        class="absolute right-6 top-1/2 transform -translate-y-1/2 text-gray-500">
                    <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
                </button>
            </div>
        </div>

        <!-- Sign Up Button -->
        <button
            type="submit"
            class="w-full bg-[#30B2E1] text-white py-3.5 rounded-full hover:bg-[#2AA0CF] transition-colors text-lg font-semibold form-element"
        >
            SIGN UP
        </button>
    </form>
</div>
