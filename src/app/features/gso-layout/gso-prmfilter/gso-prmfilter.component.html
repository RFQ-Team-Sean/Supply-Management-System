<div class="bg-white rounded-lg shadow-lg p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold">▼ Filter</h2>
  </div>

  <!-- Department Filter -->
  <div class="mb-4">
    <div class="flex justify-between items-center mb-2">
      <label class="text-sm text-gray-600">Department</label>
      <button 
        (click)="resetDepartment()" 
        class="text-xs text-blue-500 hover:text-blue-700">
        Reset
      </button>
    </div>
    <select 
      [(ngModel)]="filter.department"
      class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Select Department</option>
      <option value="IT">IT Department</option>
      <option value="HR">HR Department</option>
      <option value="Finance">Finance Department</option>
      <option value="Operations">Operations Department</option>
    </select>
  </div>

  <!-- Date Range Filter -->
  <div class="mb-4">
    <div class="flex justify-between items-center mb-2">
      <label class="text-sm text-gray-600">Date Range</label>
      <button 
        (click)="resetDateRange()" 
        class="text-xs text-blue-500 hover:text-blue-700">
        Reset
      </button>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-xs text-gray-500">From:</label>
        <input 
          type="date" 
          [(ngModel)]="filter.dateFrom"
          class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="text-xs text-gray-500">To:</label>
        <input 
          type="date" 
          [(ngModel)]="filter.dateTo"
          class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>

  <!-- Status Filter -->
  <div class="mb-6">
    <div class="flex justify-between items-center mb-2">
      <label class="text-sm text-gray-600">Status</label>
      <button 
        (click)="resetStatus()" 
        class="text-xs text-blue-500 hover:text-blue-700">
        Reset
      </button>
    </div>
    <select 
      [(ngModel)]="filter.status"
      class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Select Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>

  <!-- Action Buttons -->
  <div class="flex gap-2">
    <button 
      (click)="resetAll()"
      class="flex-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300">
      Reset
    </button>
    <button 
      (click)="applyFilter()"
      class="flex-1 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-300">
      Apply
    </button>
  </div>
</div>
