<div class="flex gap-6">
    <!-- Right Side: Table -->
    <div class="flex-1">
      <!-- Search Bar -->
      <div class="flex mb-4">
        <div class="flex-grow flex items-center border rounded-lg px-2 bg-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
          <input 
            type="text" 
            placeholder="Search by department or fiscal year" 
            class="w-full p-2 focus:outline-none"
            (input)="searchLogs($event)"
          />
        </div>
      </div>
  
      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full table-fixed">
          <thead class="bg-gray-50">
            <tr>
              <th class="w-[10%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">No.</th>
              <th class="w-[10%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Department</th>
              <th class="w-[20%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">PR Tracking ID</th>
              <th class="w-[15%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Date Created</th>
              <th class="w-[15%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Date Returned </th>
              <th class="w-[15%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Remarks</th>
            </tr>
          </thead> 
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let prm of displayedPRMs; let i = index" class="hover:bg-gray-50 transition duration-300">
              <td class="px-2 py-4 text-sm text-gray-900 text-center">{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
              <td class="px-2 py-4 text-sm text-gray-900 text-center">{{ prm.department }}</td>
              <td class="px-2 py-4 text-sm text-gray-900 text-center">{{ prm.pr_tracking_id }}</td>
              <td class="px-2 py-4 text-sm text-gray-500 text-center">{{ prm.date_created }}</td>
              <td class="px-2 py-4 text-sm text-gray-900 text-center">{{ prm.date_returned }}</td>
              <td class="px-2 py-4 text-sm text-gray-900 text-center">{{ prm.remarks }}</td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <!-- Pagination -->
      <div class="flex items-center justify-between mt-4">
        <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          Previous
        </button>
        <div class="flex space-x-2">
          <span *ngFor="let page of [].constructor(totalPages); let i = index" (click)="changePage(i + 1)" [ngClass]="{'bg-blue-500 text-white': currentPage === i + 1, 'bg-gray-200 text-gray-700': currentPage !== i + 1}" class="px-3 py-1 rounded-lg cursor-pointer">
            {{ i + 1 }}
          </span>
        </div>
        <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          Next
        </button>
      </div>
    </div>
  </div>
