<div *ngIf="ppmpData" class="bg-white rounded-lg shadow-sm p-6">
  <h2 class="text-xl font-semibold mb-6">Update Project Procurement Management Plan</h2>

  <form #ppmpForm="ngForm" class="space-y-6">
    <!-- Header Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
        <input
          type="text"
          [(ngModel)]="ppmpData.project_name"
          name="project_name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
        <input
          type="text"
          [(ngModel)]="ppmpData.department"
          name="department"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Total Budget</label>
        <input
          type="number"
          [(ngModel)]="ppmpData.total_budget"
          name="total_budget"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Items Grouped by Category -->
    <div class="space-y-6">
      <div *ngFor="let category of uniqueCategories()" class="border rounded-lg overflow-hidden">
        <div class="bg-gray-200 p-3 border-b">
          <h3 class="font-medium text-gray-700">{{ category }}</h3>
        </div>

        <div *ngFor="let item of filterItemsByCategory(category); let i = index" class="border-b p-4">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Item Name</label>
              <input
                type="text"
                [(ngModel)]="item.item_name"
                [name]="'itemName' + i"
                class="w-full px-2 py-1 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Description</label>
              <input
                type="text"
                [(ngModel)]="item.item_description"
                [name]="'itemDescription' + i"
                class="w-full px-2 py-1 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Quantity</label>
              <input
                type="number"
                [(ngModel)]="item.quantity"
                [name]="'quantity' + i"
                class="w-full px-2 py-1 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Unit</label>
              <input
                type="text"
                [(ngModel)]="item.unit_of_measurement"
                [name]="'unitOfMeasurement' + i"
                class="w-full px-2 py-1 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Unit Cost</label>
              <input
                type="number"
                [(ngModel)]="item.est_unit_cost"
                [name]="'estUnitCost' + i"
                class="w-full px-2 py-1 border border-gray-300 rounded-md"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">Total Cost</label>
              <input
                type="number"
                [(ngModel)]="item.total_cost"
                [name]="'totalCost' + i"
                readonly
                class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 mt-6">
      <button
        type="button"
        (click)="goBack()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="updatePpmp()"
        class="px-4 py-2 border border-blue-500 rounded-md text-sm font-medium text-blue-500 bg-white hover:bg-blue-50"
      >
        Update Items
      </button>
      <button
        type="submit"
        (click)="updatePpmp()"
        class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-500 hover:bg-blue-600"
      >
        Update PPMP
      </button>
    </div>
  </form>
</div>

<div *ngIf="!ppmpData">
  <p class="text-center p-4">Loading...</p>
</div>
