<div *ngIf="ppmpData" class="bg-white rounded-lg shadow-sm p-6">
  <h2 class="text-xl font-semibold mb-6">Update Project Procurement Management Plan</h2>

  <form #ppmpForm="ngForm" class="space-y-6">
    <!-- Header Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
        <input
          type="text"
          [(ngModel)]="ppmpData.department"
          name="department"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
        <input
          type="text"
          [(ngModel)]="ppmpData.project_name"
          name="projectName"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Total Budget</label>
        <input
          type="number"
          [(ngModel)]="ppmpData.total_budget"
          name="totalBudget"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Categories Section -->
    <div class="space-y-4">
      <div *ngFor="let category of ppmpData.categories; let i = index" class="border rounded-lg p-4">
        <div class="flex justify-between items-center mb-4">
          <div class="w-full mr-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <input
              type="text"
              [(ngModel)]="category.name"
              [name]="'categoryName' + i"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <button
            type="button"
            (click)="removeCategory(i)"
            class="text-red-600 hover:text-red-800 self-end"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>

        <!-- Items Section -->
        <div class="space-y-6">
          <ng-container *ngFor="let item of category.items; let j = index">
            <!-- Individual Item Section with Headers -->
            <div class="border rounded-lg overflow-hidden">
              <div class="bg-gray-100 p-3 border-b flex justify-between items-center">
                <h3 class="font-medium text-gray-700">Item {{j + 1}}</h3>
                <button
                  type="button"
                  (click)="removeItem(i, j)"
                  class="text-red-600 hover:text-red-800"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>

              <!-- Item Details Grid -->
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4">
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Item Name</label>
                  <input
                    type="text"
                    [(ngModel)]="item.item_name"
                    [name]="'itemName' + i + '-' + j"
                    class="w-full px-2 py-1 border border-gray-300 rounded-md"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Description</label>
                  <input
                    type="text"
                    [(ngModel)]="item.item_description"
                    [name]="'itemDescription' + i + '-' + j"
                    class="w-full px-2 py-1 border border-gray-300 rounded-md"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Quantity</label>
                  <input
                    type="number"
                    [(ngModel)]="item.quantity"
                    [name]="'quantity' + i + '-' + j"
                    (input)="calculateTotalCost(item)"
                    class="w-full px-2 py-1 border border-gray-300 rounded-md"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Unit</label>
                  <input
                    type="text"
                    [(ngModel)]="item.unit_of_measurement"
                    [name]="'unitOfMeasurement' + i + '-' + j"
                    class="w-full px-2 py-1 border border-gray-300 rounded-md"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Unit Cost</label>
                  <input
                    type="number"
                    [(ngModel)]="item.est_unit_cost"
                    [name]="'estimatedUnitCost' + i + '-' + j"
                    (input)="calculateTotalCost(item)"
                    class="w-full px-2 py-1 border border-gray-300 rounded-md"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-700 mb-1">Total Cost</label>
                  <input
                    type="number"
                    [(ngModel)]="item.total_cost"
                    [name]="'totalCost' + i + '-' + j"
                    readonly
                    class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
                  />
                </div>
              </div>

              <!-- Quarterly Distribution Section -->
              <div class="border-t bg-gray-50 p-4">
                <h4 class="text-sm font-medium text-gray-700 mb-3">Quarterly Distribution</h4>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <!-- Q1 -->
                  <div class="border rounded-md p-3 bg-blue-50">
                    <div class="text-sm font-medium text-blue-800 mb-2">Quarter 1</div>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Quantity</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q1.quantity"
                          [name]="'q1Quantity' + i + '-' + j"
                          (input)="calculateQuarterAmount(item, 'q1')"
                          class="w-full px-2 py-1 border border-gray-300 rounded-md"
                        />
                      </div>
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Amount</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q1.amount"
                          [name]="'q1Amount' + i + '-' + j"
                          readonly
                          class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Q2 -->
                  <div class="border rounded-md p-3 bg-green-50">
                    <div class="text-sm font-medium text-green-800 mb-2">Quarter 2</div>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Quantity</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q2.quantity"
                          [name]="'q2Quantity' + i + '-' + j"
                          (input)="calculateQuarterAmount(item, 'q2')"
                          class="w-full px-2 py-1 border border-gray-300 rounded-md"
                        />
                      </div>
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Amount</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q2.amount"
                          [name]="'q2Amount' + i + '-' + j"
                          readonly
                          class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Q3 -->
                  <div class="border rounded-md p-3 bg-yellow-50">
                    <div class="text-sm font-medium text-yellow-800 mb-2">Quarter 3</div>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Quantity</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q3.quantity"
                          [name]="'q3Quantity' + i + '-' + j"
                          (input)="calculateQuarterAmount(item, 'q3')"
                          class="w-full px-2 py-1 border border-gray-300 rounded-md"
                        />
                      </div>
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Amount</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q3.amount"
                          [name]="'q3Amount' + i + '-' + j"
                          readonly
                          class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Q4 -->
                  <div class="border rounded-md p-3 bg-purple-50">
                    <div class="text-sm font-medium text-purple-800 mb-2">Quarter 4</div>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Quantity</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q4.quantity"
                          [name]="'q4Quantity' + i + '-' + j"
                          (input)="calculateQuarterAmount(item, 'q4')"
                          class="w-full px-2 py-1 border border-gray-300 rounded-md"
                        />
                      </div>
                      <div>
                        <label class="block text-xs text-gray-600 mb-1">Amount</label>
                        <input
                          type="number"
                          [(ngModel)]="item.quarter_distribution.q4.amount"
                          [name]="'q4Amount' + i + '-' + j"
                          readonly
                          class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>

          <!-- Add Item Button -->
          <div class="flex justify-center mt-4">
            <button
              type="button"
              (click)="addItem(i)"
              class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
            >
              Add Item
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Category Button -->
    <div class="flex justify-center mt-6">
      <button
        type="button"
        (click)="addCategory()"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
      >
        Add Category
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 mt-6">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="onSaveAsDraft()"
        class="px-4 py-2 border border-blue-500 rounded-md text-sm font-medium text-blue-500 bg-white hover:bg-blue-50"
      >
        Update Draft
      </button>
      <button
        type="submit"
        (click)="onSubmit('Pending')"
        class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-500 hover:bg-blue-600"
        >
          Submit PPMP
        </button>
      </div>
    </form>
  </div>
  
  <div *ngIf="!ppmpData">
    <div class="flex items-center justify-center h-64">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
        <p class="mt-4 text-gray-600">Loading PPMP data...</p>
      </div>
    </div>
  </div>
