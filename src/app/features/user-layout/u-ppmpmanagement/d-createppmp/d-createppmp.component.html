<div class="bg-white rounded-lg shadow-sm p-6">
  <h2 class="text-xl font-semibold mb-6">New Project Procurement Management Plan</h2>

  <form #ppmpForm="ngForm" class="space-y-6">
    <!-- Header Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fiscal Year</label>
        <input type="text" [(ngModel)]="formData.fiscalYear" name="fiscalYear" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
        <input type="text" [(ngModel)]="formData.department" name="department"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
        <input type="text" [(ngModel)]="formData.projectName" name="projectName"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Department Budget</label>
        <input type="number" [(ngModel)]="formData.estimatedBudget" name="estimatedBudget"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Remaining Department Budget</label>
        <input type="number" [(ngModel)]="formData.remainingBudget" name="remainingBudget"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>
    </div>

    <!-- Items Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead>
          <tr>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Item Name</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Item Description</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Quantity</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Unit of Measurement</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Estimated Unit Cost</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Total Cost</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Procurement Mode</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Schedule</th>
            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Purpose</th>
            <th class="px-4 py-2"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr *ngFor="let item of formData.items; let i = index">
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.itemName" [name]="'itemName' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.itemDescription" [name]="'itemDescription' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="number" [(ngModel)]="item.quantity" [name]="'quantity' + i"
                     (input)="calculateTotalCost(item)"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.unitOfMeasurement" [name]="'unitOfMeasurement' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="number" [(ngModel)]="item.estimatedUnitCost" [name]="'estimatedUnitCost' + i"
                     (input)="calculateTotalCost(item)"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="number" [(ngModel)]="item.totalCost" [name]="'totalCost' + i"
                     readonly
                     class="w-full px-2 py-1 border border-gray-300 rounded-md bg-gray-50">
            </td>
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.procurementMode" [name]="'procurementMode' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.schedule" [name]="'schedule' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <input type="text" [(ngModel)]="item.purpose" [name]="'purpose' + i"
                     class="w-full px-2 py-1 border border-gray-300 rounded-md">
            </td>
            <td class="px-4 py-2">
              <button type="button" (click)="removeItem(i)"
                      class="text-red-600 hover:text-red-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Add Item Button -->
    <div class="flex justify-center">
      <button type="button" (click)="addItem()"
              class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        Add Item
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3">
      <button type="button" (click)="onCancel()"
              class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
        Cancel
      </button>
      <button type="button" (click)="onSaveAsDraft()"
              class="px-4 py-2 border border-blue-500 rounded-md text-sm font-medium text-blue-500 bg-white hover:bg-blue-50">
        Save as Draft
      </button>
      <button type="submit" (click)="onSubmit()"
              class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-500 hover:bg-blue-600">
        Submit
      </button>
    </div>
  </form>
</div>
