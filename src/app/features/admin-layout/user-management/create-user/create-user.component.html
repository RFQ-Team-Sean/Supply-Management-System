<main class="flex flex-col items-start px-2 bg-white max-w-[400px] mx-auto">
    <form (ngSubmit)="onSubmit()" class="w-full">
      <!-- Image Upload Section -->
      <div class="flex flex-col items-center mb-1">
        <div class="w-16 h-16 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden">
          <img *ngIf="imagePreview" [src]="imagePreview" class="w-full h-full object-cover" alt="Profile preview">
          <span *ngIf="!imagePreview" class="text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
          </span>
        </div>
        <input
          type="file"
          id="image"
          (change)="onImageSelected($event)"
          accept="image/*"
          class="hidden"
          #fileInput
        />
        <button 
          type="button"
          (click)="fileInput.click()"
          class="text-[10px] text-blue-600 hover:text-blue-700 mt-0.5"
        >
          Upload Photo
        </button>
      </div>

      <div class="space-y-1">
        <div>
          <label for="username" class="text-[10px] font-bold">Name</label>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            class="w-full py-1 px-2 border border-zinc-300 rounded-lg text-xs"
            placeholder="Username"
          />
        </div>

        <div>
          <label for="email" class="text-[10px] font-bold">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            class="w-full py-1 px-2 border border-zinc-300 rounded-lg text-xs"
            placeholder="sample@gmail.com"
          />
        </div>

        <!-- Role and Status side by side -->
        <div class="flex gap-1">
          <div class="flex-1">
            <label for="role" class="text-[10px] font-bold">Role</label>
            <select
              id="role"
              [(ngModel)]="selectedRole"
              name="role"
              class="w-full py-1 px-2 border border-zinc-300 rounded-lg text-xs"
            >
              <option value="" hidden>Select Role</option>
              <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
            </select>
          </div>

          <div class="flex-1">
            <label for="status" class="text-[10px] font-bold">Status</label>
            <select
              id="status"
              [(ngModel)]="selectedStatus"
              name="status"
              class="w-full py-1 px-2 border border-zinc-300 rounded-lg text-xs"
            >
              <option value="" disabled hidden>Select Status</option>
              <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-1 bg-blue-600 text-white font-bold rounded-lg text-xs hover:bg-blue-700 mt-4"
        >
          Save
        </button>
      </div>
    </form>
  </main>
