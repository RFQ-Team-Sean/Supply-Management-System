<div class="space-y-4">
  <!-- Search Bar -->
  <div class="flex mb-4">
    <div class="flex-grow flex items-center border rounded-lg px-2 bg-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
      </svg>
      <input 
        type="text" 
        placeholder="Search activity logs" 
        class="w-full p-2 focus:outline-none"
        (input)="searchLogs($event)"
      />
    </div>
  </div>

  <!-- Activity Logs Table -->
  <table class="min-w-full">
    <thead class="bg-gray-50">
      <tr>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Detail</th>
        <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let log of displayedLogs" class="hover:bg-gray-50">
        <td class="py-4 px-6 text-sm text-center text-gray-900">{{ log.name }}</td>
        <td class="py-4 px-6 text-sm text-center text-gray-500">{{ log.role }}</td>
        <td class="py-4 px-6 text-sm text-center text-gray-500">{{ log.action }}</td>
        <td class="py-4 px-6 text-sm text-center text-gray-500">{{ log.type }}</td>
        <td class="py-4 px-6 text-sm text-center text-gray-500">{{ log.details }}</td>
        <td class="py-4 px-6 text-sm text-center text-gray-500">{{ log.timestamp }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="flex items-center justify-between mt-4">
    <button 
      (click)="changePage(currentPage - 1)" 
      [disabled]="currentPage === 1" 
      class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Previous
    </button>

    <div class="flex space-x-2">
      <span 
        *ngFor="let page of [].constructor(totalPages); let i = index" 
        (click)="changePage(i + 1)" 
        [ngClass]="{'bg-blue-500 text-white': currentPage === i + 1, 'bg-gray-200 text-gray-700': currentPage !== i + 1}" 
        class="px-3 py-1 rounded-lg cursor-pointer"
      >
        {{ i + 1 }}
      </span>
    </div>

    <button 
      (click)="changePage(currentPage + 1)" 
      [disabled]="currentPage === totalPages" 
      class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Next
    </button>
  </div>
</div>
