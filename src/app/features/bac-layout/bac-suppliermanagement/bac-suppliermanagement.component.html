<div class="flex justify-between items-center mb-4 mt-1">
    <h1 class="text-3xl font-bold text-gray-800">Supplier Management</h1>
  </div>
  
  <!-- Main Content Container with Flex -->
  <div class="max-w-8xl mx-auto">
    <div class="flex gap-6">
      <!-- Left Side: Filters -->
      <div class="w-[300px] flex-shrink-0">
        <app-suppliermanagement-filter (filterChanged)="handleFilterChange($event)">
        </app-suppliermanagement-filter>
      </div>
  
      <!-- Right Side: Tables -->
      <div class="flex-1">
        <!-- Option Buttons -->
        <div class="flex gap-4 mb-4 border-b border-gray-200">
          <button 
            (click)="switchView('registered')" 
            [ngClass]="{'text-indigo-950 border-indigo-950': currentView === 'registered', 
                        'text-gray-500 border-transparent hover:text-indigo-950': currentView !== 'registered'}"
            class="px-3 py-2 text-xs font-medium transition-colors border-b-2"
          >
            Registered Suppliers
          </button>
          <button 
            (click)="switchView('performance')" 
            [ngClass]="{'text-indigo-950 border-indigo-950': currentView === 'performance', 
                        'text-gray-500 border-transparent hover:text-indigo-950': currentView !== 'performance'}"
            class="px-3 py-2 text-xs font-medium transition-colors border-b-2"
          >
            Performance
          </button>
        </div>
  
        <!-- Users Table -->
        <div *ngIf="currentView === 'registered'" class="bg-white rounded-lg shadow-lg p-4">
          <div class="flex mb-4">
            <div class="flex-grow flex items-center border rounded-lg px-2 bg-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
              <input 
                type="text" 
                placeholder="Search users by name, email or role" 
                class="w-full p-2 focus:outline-none"
                (input)="searchRoles($event)"
              />
            </div>
          </div>
  
          <div class="overflow-x-auto">
            <table class="w-full table-fixed">
              <thead class="bg-gray-50">
                <tr>
                  <th class="w-[8%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">ID</th>
                  <th class="w-[20%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Supplier</th>
                  <th class="w-[20%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Contact Person</th>
                  <th class="w-[12%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Phone Number</th>
                  <th class="w-[15%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Email Address</th>
                  <th class="w-[17%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Status</th>
                  <th class="w-[8%] py-3 px-2 text-center text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <tr *ngFor="let spm of displayedSpm" class="hover:bg-gray-50">
                  <td class="px-2 py-4 text-sm text-gray-500 text-center">{{ spm.id }}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 break-words">{{ spm.supplier }}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 break-words">{{ spm.contact_person }}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 text-center">{{ spm.phone_number }}</td>
                  <td class="px-2 py-4 text-sm text-gray-500 text-center">{{ spm.email_address }}</td>
                  <td class="px-2 py-4">
                    <span [ngClass]="{
                      'text-green-600': spm.status === 'Active',
                      'text-red-600': spm.status === 'Inactive'
                    }" class="text-sm font-medium block text-center whitespace-normal">
                      {{ spm.status }}
                    </span>
                  </td>
                  <td class="px-2 py-4 text-sm font-medium relative text-center">
                    <button (click)="toggleActions(spm)" class="flex justify-center items-center h-full w-full">
                      <img src="assets/icons/action.png" alt="Actions Icon" class="w-5 h-5 mx-auto" />
                    </button>
                    <div *ngIf="currentOpenActionId === spm.id" class="absolute right-0 bg-white shadow-md rounded-md mt-2 z-10">
                      <div class="flex flex-col">
                        <button (click)="deactiveSpm(spm)" class="px-4 py-2 text-left hover:bg-blue-500 hover:text-white">Deactivate</button>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
  
          <!-- Pagination -->
          <div class="flex items-center justify-between mt-4">
            <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
              Previous
            </button>
  
            <div class="flex space-x-2">
              <span *ngFor="let page of [].constructor(totalPages); let i = index" (click)="changePage(i + 1)" [ngClass]="{'bg-blue-500 text-white': currentPage === i + 1, 'bg-gray-200 text-gray-700': currentPage !== i + 1}" class="px-3 py-1 rounded-lg cursor-pointer">
                {{ i + 1 }}
              </span>
            </div>
  
            <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
              Next
            </button>
          </div>
        </div>
  
        <!-- Winning Bid -->
        <div *ngIf="currentView === 'performance'" class="bg-white rounded-lg shadow-lg p-4">
            <app-suppliermanagement-performance></app-suppliermanagement-performance>
        </div>
      </div>
    </div>
  </div>
  
  <router-outlet></router-outlet>
