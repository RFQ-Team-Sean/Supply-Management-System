<div class="flex justify-between items-center mb-4 mt-1">
    <h1 class="text-3xl font-bold text-gray-800">BID Management</h1>
  </div>
  
  <!-- Main Content Container with Flex -->
  <div class="max-w-8xl mx-auto">
    <div class="flex gap-6">
      <!-- Left Side: Filters -->
      <div class="w-[300px] flex-shrink-0">
        <app-bidmanagment-filter (filterChanged)="handleFilterChange($event)">
        </app-bidmanagment-filter>
      </div>
  
      <!-- Right Side: Tables -->
      <div class="flex-1">
        <!-- Option Buttons -->
        <div class="flex gap-4 mb-4 border-b border-gray-200">
          <button 
            (click)="switchView('active')" 
            [ngClass]="{'text-indigo-950 border-indigo-950': currentView === 'active', 
                        'text-gray-500 border-transparent hover:text-indigo-950': currentView !== 'active'}"
            class="px-3 py-2 text-xs font-medium transition-colors border-b-2"
          >
            Active Bids
          </button>
          <button 
            (click)="switchView('invitation')" 
            [ngClass]="{'text-indigo-950 border-indigo-950': currentView === 'invitation', 
                        'text-gray-500 border-transparent hover:text-indigo-950': currentView !== 'invitation'}"
            class="px-3 py-2 text-xs font-medium transition-colors border-b-2"
          >
            Bid Invitation
          </button>
          <button 
            (click)="switchView('canvas')" 
            [ngClass]="{'text-indigo-950 border-indigo-950': currentView === 'canvas', 
                        'text-gray-500 border-transparent hover:text-indigo-950': currentView !== 'canvas'}"
            class="px-3 py-2 text-xs font-medium transition-colors border-b-2"
          >
            Bids Canvas
          </button>
        </div>
  
        <!-- Users Table -->
        <div *ngIf="currentView === 'active'" class="bg-white rounded-lg shadow-lg p-4">
          <div class="flex mb-4">
            <div class="flex-grow flex items-center border rounded-lg px-2 bg-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
              <input 
                type="text" 
                placeholder="Search users by name, email or role" 
                class="w-full p-2 focus:outline-none"
                (input)="searchRoles($event)"
              />
            </div>
          </div>
  
          <table class="min-w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Purchase Request Item</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Bidders</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Start</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">End</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="py-3 px-6 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
              <tr *ngFor="let bidm of displayedBidm" class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ bidm.number }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ bidm.requested_items.join(', ') }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ bidm.bidders }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ bidm.start }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ bidm.end }}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <span [ngClass]="{
                    'text-blue-600': bidm.status === 'On-Going',
                  }" class="text-sm font-medium">
                    {{ bidm.status }}
                  </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium relative">
                  <button (click)="toggleActions(bidm)" class="flex justify-center items-center h-full w-full">
                    <img src="assets/icons/action.png" alt="Actions Icon" class="w-5 h-5 mx-auto" />
                  </button>
                  <div *ngIf="currentOpenActionId === bidm.id" class="absolute right-0 bg-white shadow-md rounded-md mt-2 z-10">
                    <div class="flex flex-col">
                      <button (click)="reviewBids(bidm)" class="px-4 py-2 text-left hover:bg-blue-500 hover:text-white">Review Bids</button>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
  
          <!-- Pagination -->
          <div class="flex items-center justify-between mt-4">
            <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
              Previous
            </button>
  
            <div class="flex space-x-2">
              <span *ngFor="let page of [].constructor(totalPages); let i = index" (click)="changePage(i + 1)" [ngClass]="{'bg-blue-500 text-white': currentPage === i + 1, 'bg-gray-200 text-gray-700': currentPage !== i + 1}" class="px-3 py-1 rounded-lg cursor-pointer">
                {{ i + 1 }}
              </span>
            </div>
  
            <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
              Next
            </button>
          </div>
        </div>
  
        <!-- Bid Invintation -->
        <div *ngIf="currentView === 'invitation'" class="bg-white rounded-lg shadow-lg p-4">
          <app-bidmanagement-bidinvitation></app-bidmanagement-bidinvitation>
        </div>
  
        <!-- Bid Canvas -->
        <div *ngIf="currentView === 'canvas'" class="bg-white rounded-lg shadow-lg p-4">
          <app-bidmanagement-bidcanvas></app-bidmanagement-bidcanvas>
        </div>
      </div>
    </div>
  </div>
  
  <router-outlet></router-outlet>
