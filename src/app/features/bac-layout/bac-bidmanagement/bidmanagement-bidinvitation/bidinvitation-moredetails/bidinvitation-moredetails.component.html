<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-auto relative">
    <!-- Header with Status -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold">Bidder Details</h2>
      <div class="flex items-center gap-2">
        <span class="text-gray-600">Status:</span>
        <span class="text-blue-500">{{ bidm?.status || 'Pending' }}</span>
      </div>
    </div>

    <!-- Bidder -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Bidder</label>
      <input 
        type="text" 
        [value]="bidm?.supplier_name"
        class="w-full border rounded-md p-2 text-sm"
        readonly
      >
    </div>

    <!-- Bid Title -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Bid Title</label>
      <input 
        type="text" 
        [value]="bidm?.number"
        class="w-full border rounded-md p-2 text-sm"
        readonly
      >
    </div>

    <!-- Purchase Item Request -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Purchase Item Request</label>
      <input 
        type="text" 
        [value]="'IT supplies'"
        class="w-full border rounded-md p-2 text-sm"
        readonly
      >
    </div>

    <!-- Active Bidders -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Active Bidders</label>
      <div class="border rounded-md p-3 space-y-2">
        <div class="text-sm text-gray-600">{{ bidm?.supplier_name }}</div>
      </div>
    </div>

    <!-- Attached File -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Attached File</label>
      <div class="flex items-center justify-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span class="text-base text-gray-600">{{ attachedFile.name }}</span>
        <button 
          (click)="viewFile()" 
          class="text-base text-blue-500 hover:text-blue-600 font-medium"
        >
          view
        </button>
      </div>
    </div>

    <!-- Date Range -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-2">
        <label class="text-sm text-gray-600">Date Range</label>
        <button class="text-sm text-blue-500" (click)="resetDates()">Reset</button>
      </div>
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="text-xs text-gray-500 block">From:</label>
          <input type="date" [value]="dateFrom" class="w-full border rounded-md p-2 text-sm" readonly>
        </div>
        <div class="flex-1">
          <label class="text-xs text-gray-500 block">To:</label>
          <input type="date" [value]="dateTo" class="w-full border rounded-md p-2 text-sm" readonly>
        </div>
      </div>
    </div>

    <!-- Confirm Button -->
    <div class="flex justify-end">
      <button 
        (click)="confirm()" 
        class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
      >
        Confirm
      </button>
    </div>
  </div>
</div>
