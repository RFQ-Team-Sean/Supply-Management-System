<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-auto relative">
    <!-- Header with Status -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold">Bid Quotations</h2>
      <div class="flex items-center gap-2">
        <span class="text-gray-600">Status:</span>
        <span class="text-blue-500">Pending</span>
      </div>
    </div>

    <!-- Bid Details -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Bid Details</label>
      <input 
        type="text" 
        [value]="bidm?.number + ' - ' + bidm?.supplier_name"
        class="w-full border rounded-md p-2 text-sm mb-3"
        readonly
      >
      <div class="flex items-center justify-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span class="text-base text-gray-600">{{ attachedFile.name }}</span>
        <button 
          (click)="viewFile(attachedFile.name)" 
          class="text-base text-blue-500 hover:text-blue-600 font-medium"
        >
          view
        </button>
      </div>
    </div>

    <!-- Active Bidders -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Active Bidders</label>
      <div class="border rounded-md p-4 space-y-3">
        <div *ngFor="let bidder of activeBidders" class="flex items-center justify-between">
          <span class="text-sm text-gray-600">{{ bidder.name }}</span>
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            <span class="text-sm text-gray-600">{{ bidder.file }}</span>
            <button 
              (click)="viewFile(bidder.file)" 
              class="text-sm text-blue-500 hover:text-blue-600"
            >
              view
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirm Button -->
    <div class="flex justify-end">
      <button 
        (click)="confirm()" 
        class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
      >
        Confirm
      </button>
    </div>
  </div>
</div>
