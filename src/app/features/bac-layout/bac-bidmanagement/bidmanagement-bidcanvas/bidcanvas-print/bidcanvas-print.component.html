<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-4xl mx-auto relative">
    <!-- Exit Button -->
    <button 
      (click)="print()" 
      class="absolute top-4 right-4 text-gray-500 hover:text-gray-700"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <h2 class="text-xl font-semibold mb-6">Bid Quotations</h2>

    <!-- Bid Details -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Bid Details</label>
      <input 
        type="text" 
        [value]="bidm?.number + ' - ' + bidm?.supplier_name"
        class="w-full border rounded-md p-2 text-sm mb-3"
        readonly
      >
      <div class="flex items-center gap-3 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span class="text-base text-gray-600">{{ attachedFile.name }}</span>
        <button 
          (click)="viewFile()" 
          class="text-base text-blue-500 hover:text-blue-600 font-medium"
        >
          view
        </button>
      </div>
    </div>

    <!-- Active Bidders -->
    <div class="mb-6">
      <label class="text-sm text-gray-600 block mb-2">Active Bidders</label>
      <div class="text-sm text-gray-600 mb-2">{{ bidm?.supplier_name }}</div>
    </div>

    <!-- PDF Preview -->
    <div class="mb-6">
      <div class="border rounded-lg p-4 bg-gray-50">
        <div class="grid grid-cols-2 gap-4">
          <!-- First Quotation Preview -->
          <div class="border rounded-lg p-4 bg-white">
            <img src="assets/images/quotation-template.png" alt="Quotation Preview" class="w-full h-auto">
          </div>
          <!-- Second Quotation Preview -->
          <div class="border rounded-lg p-4 bg-white">
            <img src="assets/images/quotation-template.png" alt="Quotation Preview" class="w-full h-auto">
          </div>
        </div>
      </div>
    </div>

    <!-- Print Button -->
    <div class="flex justify-end">
      <button 
        (click)="print()" 
        class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
      >
        Print
      </button>
    </div>
  </div>
</div>
