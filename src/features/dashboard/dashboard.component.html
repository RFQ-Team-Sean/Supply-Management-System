<div class="p-6 bg-gray-50 min-h-screen">
  <!-- Welcome Section -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">{{ welcomeMessage() }}</h1>
    <p class="mt-1 text-gray-600">{{ description() }}</p>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 gap-6 mb-8 sm:grid-cols-2 lg:grid-cols-4">
    <div *ngFor="let stat of statCards()" class="p-6 bg-white rounded-xl shadow-sm transition-transform hover:-translate-y-1 duration-300">
      <div class="flex items-center">
        <div class="p-2 rounded-lg flex items-center justify-center" [ngClass]="stat.color">
          <!-- Use the icon component directly based on the stat.icon value -->
          <ng-container [ngSwitch]="stat.icon">
            <i *ngSwitchCase="'Users'" class="w-6 h-6 text-white"><lucide-users /></i>
            <i *ngSwitchCase="'Package'" class="w-6 h-6 text-white"><lucide-package /></i>
            <i *ngSwitchCase="'Activity'" class="w-6 h-6 text-white"><lucide-activity /></i>
            <i *ngSwitchCase="'AlertCircle'" class="w-6 h-6 text-white"><lucide-alert-circle /></i>
          </ng-container>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">{{ stat.title }}</p>
          <p class="text-2xl font-semibold text-gray-900">{{ stat.value }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="p-6 bg-white rounded-xl shadow-sm mb-8">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Activity Overview</h2>
    <div class="h-72 w-full">
      <!-- Add your preferred charting library implementation here -->
      <div class="w-full h-full bg-gray-50 rounded-lg flex items-center justify-center">
        <!-- Placeholder for chart -->
      </div>
    </div>
  </div>

  <!-- Recent Activities -->
  <div class="p-6 bg-white rounded-xl shadow-sm">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Recent Activities</h2>
    <div class="space-y-4">
      <div *ngFor="let activity of recentActivities()" class="flex items-center p-4 bg-gray-50 rounded-lg transition-all hover:bg-gray-100">
        <div class="w-2 h-2 rounded-full" [ngClass]="activity.status"></div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-900">{{ activity.title }}</p>
          <p class="text-xs text-gray-500">{{ activity.time }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
